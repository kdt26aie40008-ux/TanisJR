<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 170" width="880" height="170" font-family="'Segoe UI','Yu Gothic UI','Meiryo',sans-serif">
  <rect width="880" height="170" rx="12" fill="#f7f9fc"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a90"/>
    </marker>
  </defs>
  <g font-size="15" fill="#1f2937" text-anchor="middle">
    <rect x="20" y="40" width="190" height="90" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="72" font-weight="bold" fill="#3b82f6">① Ollama を入れる</text>
    <text x="115" y="96">OllamaSetup.exe を実行</text>
    <text x="115" y="116" font-size="13" fill="#6b7a90">サインインは不要</text>

    <rect x="240" y="40" width="190" height="90" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="335" y="72" font-weight="bold" fill="#3b82f6">② Python・Node.js</text>
    <text x="335" y="96">を入れる</text>
    <text x="335" y="116" font-size="13" fill="#6b7a90">初回だけ</text>

    <rect x="460" y="40" width="190" height="90" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="555" y="72" font-weight="bold" fill="#3b82f6">③ start.bat を</text>
    <text x="555" y="96">ダブルクリック</text>
    <text x="555" y="116" font-size="13" fill="#6b7a90">初回は数分かかる</text>

    <rect x="680" y="40" width="180" height="90" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
    <text x="770" y="72" font-weight="bold" fill="#10b981">④ 画面でモデルを</text>
    <text x="770" y="96">ダウンロード</text>
    <text x="770" y="116" font-size="13" fill="#6b7a90">約5.9GB・初回だけ</text>
  </g>
  <g stroke="#6b7a90" stroke-width="2" marker-end="url(#arrow)">
    <line x1="212" y1="85" x2="236" y2="85"/>
    <line x1="432" y1="85" x2="456" y2="85"/>
    <line x1="652" y1="85" x2="676" y2="85"/>
  </g>
</svg>
